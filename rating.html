<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - Rate Ride</title>
  <link rel="stylesheet" href="style.css">
  <style>
 
    .rating-wrapper {
      padding: 90px 24px 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 16px;
      box-sizing: border-box;
      background-color: #ffffff;
      position: relative;
      z-index: 10;
    }
    .big-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #eee;
      margin-bottom: 8px;
    }
    .stars-row {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .star {
      font-size: 32px;
      color: #ddd;
      cursor: pointer;
    }
    .star.active {
      color: #f1c40f;
    }
    .feedback-input {
      width: 100%;
      height: 80px;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background-color: #f8f9fa;
      font-size: 12px;
      outline: none;
      resize: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="notch"></div>
    <div class="status-bar">
      <div>19:02</div>
      <div class="status-icons">
        <div class="signal-bars"><div class="signal-bar"></div><div class="signal-bar"></div><div class="signal-bar"></div><div class="signal-bar"></div></div>
        <span class="lte-text">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

    <div class="rating-wrapper">
      <h2 class="welcome-title" style="font-size: 20px;">Rate your ride</h2>
      
      <div class="big-avatar"></div>
      
      <div>
        <span class="driver-name" style="font-size: 16px; display:block;">Juan Dela Cruz</span>
      </div>

      <div class="stars-row">
        <span class="star active">★</span>
        <span class="star active">★</span>
        <span class="star active">★</span>
        <span class="star active">★</span>
        <span class="star active">★</span>
      </div>

      <p style="font-size: 13px; font-weight: 700; color: #214329;">Feedback:</p>

      <textarea class="feedback-input" placeholder="Write an optional comment..."></textarea>

      <a href="home.html" class="button1" style="width:100%; text-align: center; text-decoration: none; margin-top: 12px; display: block; box-sizing: border-box;">
        Submit
      </a>
    </div>
  </div>

</body>
</html>
