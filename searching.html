<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - Searching</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .search-wrapper {
      padding: 75px 24px 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      text-align: center;
    }
    .pulse-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #214329;
      border-radius: 50%;
      animation: pulse 2s infinite ease-out;
      opacity: 0;
    }
    .pulse-ring:nth-child(2) { 
      animation-delay: 0.6s; 
    }
    .pulse-ring:nth-child(3) { 
      animation-delay: 1.2s; 
    }
    
    .center-avatar {
      width: 80px;
      height: 80px;
      background-color: #f4f7f5;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
      border: 3px solid #214329;
    }
    .center-avatar img {
      width: 50px;
    }
    .info-block h3 {
      font-size: 18px;
      color: #1d1d1f;
      margin-bottom: 6px;
    }
    .info-block p {
      font-size: 12px;
      color: #666;
    }
    @keyframes pulse {
      0% { transform: scale(0.4); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: scale(1.1); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="notch"></div>
    <div class="status-bar">
      <div>19:02</div>
      <div class="status-icons">
        <div class="signal-bars"><div class="signal-bar"></div><div class="signal-bar"></div><div class="signal-bar"></div><div class="signal-bar"></div></div>
        <span class="lte-text">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

    <div class="search-wrapper">
      <div style="width: 100%; text-align: left;">
        <a href="ride-options.html" class="switch-link" style="font-size: 20px; text-decoration: none; color: #333;">❮</a>
      </div>

      <div class="pulse-container">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="center-avatar">
          <img src="logo2.png" alt="Trike">
        </div>
      </div>

      <div class="info-block">
        <h3>Finding you a tricycle...</h3>
        <p>Searching nearby drivers.<br>This may just take a few seconds.</p>
      </div>

      <a href="home.html" class="welcome-btn btn-outline" style="margin-top: 20px; text-decoration: none;">
        Cancel Request
      </a>
    </div>
  </div>

<script>
  setTimeout(() => {
    localStorage.setItem('trihatid_booking_state', 'accepted');
    window.location.href = "on-trip.html"; // 
  }, 4000);

  document.querySelector('.btn-outline').addEventListener('click', function(e) {
    e.preventDefault();
    localStorage.removeItem('trihatid_booking_state');
    window.location.href = "home.html";
  });
</script>
</body>
</html>
