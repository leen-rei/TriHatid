<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - Login</title>
  
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="phone-frame">
    
    <div class="notch"></div>
    
    <div class="status-bar">
      <div>19:02</div>
      <div class="status-icons">
        <div class="signal-bars">
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
        </div>
        <span class="lte-text">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

    <!-- Login Form Container -->
    <form class="register-box">
      <h1 class="title">TriHatid</h1>
      
      <label class="label" for="login-username">Username or Email</label>
      <input type="text" id="login-username" class="input1">
      
      <label class="label" for="login-password">Password</label>
      <input type="password" id="login-password" class="input1">
      
      <a href="home.html" class="button1">Login</a>

      <p class="switch-link">
        Don't have an account? <a href="register.html">Sign Up</a>
      </p>
    </form>

  </div>

<script>
  document.querySelector('.button1').addEventListener('click', function(e) {
    // 1. Stop the anchor tag from instantly switching pages
    e.preventDefault();
    
    if (!localStorage.getItem('user_role')) {
      localStorage.setItem('user_role', 'passenger');
    }
    
    window.location.href = "home.html";
  });
</script>

</body>
</html>
