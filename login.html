<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - Login</title>
  
  <!-- Shared App Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="phone-frame">
    
    <!-- Hardware Notch -->
    <div class="notch"></div>
    
    <!-- Top Status Bar -->
    <div class="status-bar">
      <div>19:02</div>
      <div class="status-icons">
        <div class="signal-bars">
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
        </div>
        <span class="lte-text">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

    <!-- Login Form Container -->
    <form class="register-box">
      <h1 class="title">TriHatid</h1>
      
      <label class="label" for="login-username">Username or Email</label>
      <input type="text" id="login-username" placeholder="juandriver" class="input1">
      
      <label class="label" for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="••••••••" class="input1">
      
      <!-- Button linking directly to home.html -->
      <a href="home.html" class="button1">Login</a>

      <!-- Link to Register Page if user doesn't have an account -->
      <p class="switch-link">
        Don't have an account? <a href="register.html">Sign Up</a>
      </p>
    </form>

  </div>

  <!-- Put this right before </body> in login.html -->
<script>
  document.querySelector('.button1').addEventListener('click', function(e) {
    e.preventDefault();
    
    // If no role is set yet, default them to commuter on login
    if (!localStorage.getItem('user_role')) {
      localStorage.setItem('user_role', 'commuter');
    }
    
    window.location.href = "home.html";
  });

  // At the bottom of login.html
document.querySelector('.button1').addEventListener('click', function(e) {
  e.preventDefault();
  
  // Optional fallback: if no role is saved yet, default to commuter
  if (!localStorage.getItem('user_role')) {
    localStorage.setItem('user_role', 'commuter');
  }
  
  window.location.href = "home.html";
});
</script>

</body>
</html>
