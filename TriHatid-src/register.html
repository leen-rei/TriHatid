<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - Register</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Page-specific full-screen styling without !important -->
  <style>
    body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      overflow-y: auto; /* Ensures window-level scrolling */
    }
    
    form.register-box {
      background-color: #ffffff;
      width: 100%;
      height: auto;
      min-height: 100%;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
      box-shadow: none;
      border-radius: 0;
      max-width: 100%;
      overflow-y: visible; /* Let the body handle the scroll */
    }
  </style>

  <!-- Supabase CDN and initialization -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <form class="register-box">
    <h1 class="title">TriHatid</h1>

    <label class="label" for="role-select">I am registering as a:</label>
    <select id="role-select" class="input1" style="margin-bottom: 4px; cursor: pointer;" autocomplete="off">
      <option value="passenger">Passenger (Book Rides)</option>
      <option value="driver">Driver (Accept Passengers)</option>
    </select>
    
    <label class="label" for="fullname">Name</label>
    <input type="text" id="fullname" placeholder="Juan Dela Cruz" class="input1" autocomplete="name" required>
    
    <label class="label" for="username">Username</label>
    <input type="text" id="username" placeholder="@juan" class="input1" autocomplete="username">
    
    <label class="label" for="email">Email</label>
    <input type="email" id="email" placeholder="example@email.com" class="input1" autocomplete="email" required>

    <label class="label" for="phone">Phone Number</label>
    <input type="tel" id="phone" placeholder="09123456789" class="input1" autocomplete="tel" required>

    <label class="label" for="birthdate">Birthdate</label>
    <input type="date" id="birthdate" class="input1" required>
    
    <!-- Driver-Only Fields Section (Hidden by default for Passengers) -->
    <!-- Driver-Only Fields Section (Hidden by default for Passengers) -->
    <div id="driver-fields" style="display: none; flex-direction: column;">
      <label class="label" for="franchise" style="margin-top: 10px; margin-bottom: 15px; display: block;">Franchise No.</label>
      <input type="text" id="franchise" placeholder="Enter franchise number" class="input1">

      <label class="label" for="plate" style="margin-top: 10px; margin-bottom: 15px; display: block;">Plate No.</label>
      <input type="text" id="plate" placeholder="Enter vehicle plate number" class="input1">
    </div>

    <label class="label" for="password">Password</label>
    <input type="password" id="password" class="input1" autocomplete="new-password" required>
    
    <button type="submit" class="button1" id="submit-btn" style="margin-top: 10px; border: none; width: 100%; cursor: pointer;">Sign Up</button>

    <p class="switch-link">
      Already have an account? <a href="login.html">Log In</a>
    </p>
  </form>

<script>
  const roleSelect = document.getElementById('role-select');
  const driverFields = document.getElementById('driver-fields');
  const franchiseInput = document.getElementById('franchise');
  const plateInput = document.getElementById('plate');

  // Toggle visibility and requirements of driver-specific fields dynamically
  function handleRoleChange() {
    if (roleSelect.value === 'driver') {
      driverFields.style.display = 'block';
      franchiseInput.required = true;
      plateInput.required = true;
    } else {
      driverFields.style.display = 'none';
      franchiseInput.required = false;
      plateInput.required = false;
      franchiseInput.value = '';
      plateInput.value = '';
    }
  }

  roleSelect.addEventListener('change', handleRoleChange);
  handleRoleChange(); // Initial check on load

  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const fullName = document.getElementById('fullname').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const birthdate = document.getElementById('birthdate').value;
    const role = roleSelect.value.toLowerCase().trim();

    // Build base user metadata applicable to both roles
    const userMetadata = {
      fullname: fullName,
      role: role,
      phone: phone,
      birthdate: birthdate
    };

    // Attach driver-only fields strictly if the role is driver
    if (role === 'driver') {
      userMetadata.franchise_no = franchiseInput.value.trim();
      userMetadata.plate_no = plateInput.value.trim();
    }

    // Sign up the user and pass complete metadata to the Supabase auth trigger
    const { data: authData, error: authError } = await _supabase.auth.signUp({
      email: email,
      password: password,
      options: {
        data: userMetadata
      }
    });

    if (authError) {
      alert("Registration failed: " + authError.message);
      return;
    }

    alert("Registration successful! Please log in.");
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
