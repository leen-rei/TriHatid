<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - Driver Mode</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
    }
    .driver-wrapper {
      position: relative;
      width: 100vw;
      height: calc(100vh - 75px);
      overflow: hidden;
    }
    .driver-overlay-card {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      margin: 0 auto;
      width: calc(100% - 32px);
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 18px 16px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }
    #driver-status-btn {
      background: #ccc;
      color: #333;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    #driver-status-btn.online {
      background: #2e7d32;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="driver-wrapper">
    
    <!-- MAP & STATUS OVERLAY -->
    <div id="view-home" class="view-content active">
      <div class="map-container">
        <div id="map"></div>
      </div>

      <div class="driver-overlay-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="margin: 0; font-size: 18px; color: #214329;">Driver Mode</h2>
          <button id="driver-status-btn" type="button">OFFLINE</button>
        </div>
        <p id="driver-status-text" style="margin: 0; font-size: 12px; color: #555;">You are offline. Go online to receive ride requests.</p>
        
        <div id="requests-list-container" style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;"></div>
      </div>
    </div>

    <!-- ACTIVITY HISTORY -->
    <div id="view-history" class="view-content">
      <div class="panel-view">
        <h2 class="panel-title">Activity History</h2>
        <div id="driver-history-list" style="display: flex; flex-direction: column; gap: 10px;">
          <div style="background: #fff; padding: 14px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
            <div style="font-weight: 700;">Loading driver history...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- DRIVER PROFILE -->
    <div id="view-profile" class="view-content">
      <div class="panel-view">
        <h2 class="panel-title">Account</h2>
        
        <div class="profile-header">
          <div class="profile-avatar">J</div>
          <div>
            <h3 style="margin: 0; font-size: 16px; color: #1d1d1f;">Juan Dela Cruz</h3>
            <p style="margin: 2px 0 0 0; font-size: 12px; color: #666; font-weight: 700;">Tricycle Driver</p>
          </div>
        </div>

        <div class="profile-menu-item" onclick="window.location.href='edit-profile.html';">
          <span>Edit Profile</span>
          <span style="color: #ccc;">❯</span>
        </div>

        <div class="profile-menu-item" onclick="window.location.href='messages.html';">
          <span>Messages</span>
          <span style="color: #ccc;">❯</span>
        </div>

        <div class="profile-menu-item" onclick="handleLogout()" style="color: #c62828;">
          <span>Log Out</span>
          <span>❯</span>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
      <button class="nav-item active" id="nav-home" onclick="switchView('home')" type="button">
        <div class="nav-icon icon-home"></div>
        <span>Home</span>
      </button>
      <button class="nav-item" id="nav-history" onclick="switchView('history')" type="button">
        <div class="nav-icon icon-history"></div>
        <span>History</span>
      </button>
      <button class="nav-item" id="nav-profile" onclick="switchView('profile')" type="button">
        <div class="nav-icon icon-profile"></div>
        <span>Account</span>
      </button>
    </nav>

  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  let map;
  let driverMarker = null;
  let requestMarker = null; 
  let lastSelectedRideId = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const role = localStorage.getItem('user_role');
    if (role !== 'driver') {
      alert("Unauthorized access. Redirecting to passenger home.");
      window.location.href = 'home.html';
      return;
    }

    const { data: { user } } = await _supabase.auth.getUser();
    if (user) {
      const { data: profile } = await _supabase
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .maybeSingle();

      const fullName = profile?.fullname || user.user_metadata?.fullname || 'User';
      const phone = profile?.phone || user.user_metadata?.phone || '';
      const avatarUrl = profile?.avatar_url || user.user_metadata?.avatar_url;

      const profileNameEl = document.querySelector('#view-profile h3');
      if (profileNameEl) profileNameEl.textContent = fullName;

      // Optional: display phone in account view if an element with id 'profile-phone' exists
      const phoneEl = document.getElementById('profile-phone');
      if (phoneEl) phoneEl.textContent = phone ? `Phone: ${phone}` : '';

      const avatarEl = document.querySelector('.profile-avatar');
      if (avatarEl) {
        if (avatarUrl) {
          avatarEl.innerHTML = `<img src="${avatarUrl}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
        } else if (fullName) {
          avatarEl.textContent = fullName.charAt(0).toUpperCase();
        }
      }
    }

    loadDriverHistory();

    map = L.map('map', { zoomControl: false }).setView([11.59, 122.37], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        map.setView([lat, lng], 16);

        const driverIcon = L.divIcon({
          className: 'custom-driver-pin',
          html: `<div style="background-color: #2e7d32; width: 18px; height: 18px; border: 3px solid #ffffff; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.5);"></div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
        driverMarker = L.marker([lat, lng], { icon: driverIcon }).addTo(map).bindPopup("You are here");
      }, (err) => {
        console.warn("Initial geolocation failed: ", err.message);
      }, { enableHighAccuracy: true });

      navigator.geolocation.watchPosition((position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        if (driverMarker) {
          driverMarker.setLatLng([lat, lng]);
        } else {
          const driverIcon = L.divIcon({
            className: 'custom-driver-pin',
            html: `<div style="background-color: #2e7d32; width: 18px; height: 18px; border: 3px solid #ffffff; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.5);"></div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          driverMarker = L.marker([lat, lng], { icon: driverIcon }).addTo(map).bindPopup("You are here");
        }
      }, null, { enableHighAccuracy: true });
    }

    const statusBtn = document.getElementById('driver-status-btn');
    const statusText = document.getElementById('driver-status-text');
    let isOnline = false;
    let pollTimer = null;

    if (statusBtn) {
      statusBtn.addEventListener('click', async () => {
        isOnline = !isOnline;
        if (isOnline) {
          statusBtn.textContent = 'ONLINE';
          statusBtn.classList.add('online');
          statusText.textContent = 'Active. Scanning for passengers...';

          pollTimer = setInterval(async () => {
            const { data, error } = await _supabase
              .from('rides')
              .select('*')
              .eq('status', 'searching')
              .order('id', { ascending: false });

            const container = document.getElementById('requests-list-container');
            if (!container) return;

            if (data && data.length > 0) {
              statusText.textContent = `Active. Found ${data.length} active request(s)...`;

              container.innerHTML = data.map(ride => `
                <div onclick="toggleRequestPin('${ride.id}', '${ride.pickup}', ${ride.pickup_lat || 11.59}, ${ride.pickup_lng || 122.37})" style="background: #f8f9fa; padding: 12px; border-radius: 12px; border: 1px solid #ddd; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s;">
                  <div>
                    <div style="font-size: 13px; font-weight: 700; color: #214329;">${ride.pickup} ➔ ${ride.destination}</div>
                    <div style="font-size: 11px; color: #2e7d32; font-weight: 600; margin-top: 2px;">₱${ride.fare}.00 (${ride.ride_type || 'Standard'})</div>
                  </div>
                  <div style="display: flex; gap: 8px;" onclick="event.stopPropagation();">
                    <button onclick="acceptRide('${ride.id}')" style="flex: 1; background:#2e7d32; color:#fff; border:none; padding:8px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:bold;">Accept</button>
                    <button onclick="declineRide('${ride.id}')" style="flex: 1; background:#c62828; color:#fff; border:none; padding:8px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:bold;">Decline</button>
                  </div>
                </div>
              `).join('');
            } else {
              container.innerHTML = '';
              statusText.textContent = 'Active. Scanning for passengers...';
              if (requestMarker) {
                map.removeLayer(requestMarker);
                requestMarker = null;
                lastSelectedRideId = null;
              }
            }
          }, 3000);

        } else {
          statusBtn.textContent = 'OFFLINE';
          statusBtn.classList.remove('online');
          statusText.textContent = 'You are offline. Go online to receive ride requests.';
          if (pollTimer) clearInterval(pollTimer);
          const container = document.getElementById('requests-list-container');
          if (container) container.innerHTML = '';
          if (requestMarker) {
            map.removeLayer(requestMarker);
            requestMarker = null;
            lastSelectedRideId = null;
          }
        }
      });
    }
  });

  function toggleRequestPin(rideId, pickupText, lat, lng) {
    if (lastSelectedRideId === rideId) {
      if (requestMarker) {
        map.removeLayer(requestMarker);
        requestMarker = null;
      }
      lastSelectedRideId = null;
    } else {
      if (requestMarker) {
        map.removeLayer(requestMarker);
      }

      const requestIcon = L.divIcon({
        className: 'custom-request-pin',
        html: `<div style="background-color: #214329; width: 14px; height: 14px; border: 3px solid #ffffff; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.4);"></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });

      requestMarker = L.marker([lat, lng], { icon: requestIcon }).addTo(map)
        .bindPopup(`<b>Pickup:</b> ${pickupText}`).openPopup();

      map.setView([lat, lng], 16, { animate: true });
      lastSelectedRideId = rideId;
    }
  }

  async function acceptRide(rideId) {
    const { data: { user }, error: authError } = await _supabase.auth.getUser();
    
    if (authError || !user) {
      alert("You must be logged in as a driver to accept rides.");
      return;
    }

    const metadata = user.user_metadata || {};
    const driverName = metadata.fullname || 'Driver';
    const driverAvatar = metadata.avatar_url || null;

    const { error } = await _supabase
      .from('rides')
      .update({ 
        status: 'accepted',
        driver_id: user.id,
        driver_name: driverName,
        driver_avatar_url: driverAvatar
      })
      .eq('id', rideId);

    if (error) {
      alert("Failed to accept ride.");
    } else {
      // Pass ride_id via URL instead of localStorage
      window.location.href = `driver-pickup.html?ride_id=${rideId}`;
    }
  }

  async function declineRide(rideId) {
    const { error } = await _supabase.from('rides').update({ 
      status: 'declined' 
    }).eq('id', rideId);

    if (error) {
      alert("Could not decline ride: " + error.message);
    }
  }

  function switchView(viewName) {
    document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`view-${viewName}`).classList.add('active');
    document.getElementById(`nav-${viewName}`).classList.add('active');
    if (viewName === 'home' && map) setTimeout(() => map.invalidateSize(), 150);
  }

  async function loadDriverHistory() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) return;

    const { data: rides, error } = await _supabase
      .from('rides')
      .select('*')
      .eq('driver_id', user.id)
      .eq('status', 'completed')
      .order('id', { ascending: false });

    const historyContainer = document.getElementById('driver-history-list');
    if (!historyContainer) return;

    if (error || !rides || rides.length === 0) {
      historyContainer.innerHTML = `<div style="background: #fff; padding: 14px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-weight: 700;">No trips completed yet</div>`;
      return;
    }

    historyContainer.innerHTML = rides.map(ride => `
      <div style="background: #fff; padding: 14px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
        <div style="font-weight: 700;">${ride.pickup} ➔ ${ride.destination}</div>
        <div style="font-size: 12px; color: #666; margin-top: 4px;">Earned Fare</div>
        <div style="color: #2e7d32; font-weight: 700; margin-top: 6px;">PHP ${ride.fare}.00</div>
      </div>
    `).join('');
  }

  async function handleLogout() {
    await _supabase.auth.signOut();
    localStorage.clear();
    window.location.href = 'welcome.html';
  }
</script>
</body>
</html>
