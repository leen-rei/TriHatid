<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - On Trip</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  <style>
    .trip-card {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      max-width: 400px;
      background-color: #ffffff;
      padding: 18px 16px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status-badge {
      background-color: #214329;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      align-self: center;
    }
    .fare-box {
      text-align: center;
      margin: 8px 0;
    }
    .fare-amount {
      font-size: 28px;
      font-weight: 800;
      color: #214329;
    }
    .driver-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #eee;
      padding-top: 12px;
      cursor: pointer;
    }
    .driver-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background-color: #ccc;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #555;
    }
    .driver-info {
      flex: 1;
      text-align: left;
    }
    .driver-name {
      font-size: 14px;
      font-weight: 700;
      color: #1d1d1f;
    }
    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-secondary-action {
      flex: 1;
      padding: 10px;
      background-color: #f0f0f0;
      color: #333;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <div id="map" style="width: 100vw; height: 100vh; position: absolute; top: 0; left: 0;"></div>

  <div class="trip-card">
    <div class="status-badge">Enjoy your ride!</div>
    
    <div class="fare-box">
      <p style="font-size: 11px; color: #666;">Amount to pay</p>
      <span class="fare-amount">₱ 40.00</span>
    </div>

    <div class="driver-profile">
      <div class="driver-avatar"></div>
      <div class="driver-info">
        <span class="driver-name">Juan Dela Cruz</span>
        <span id="driver-phone-label" style="font-size: 11px; color: #666; display: block;"></span>
      </div>
    </div>

    <div class="action-row">
      <a href="#" id="call-btn" class="btn-secondary-action">Call</a>
      <a href="#" id="chat-btn" class="btn-secondary-action">Chat</a>
    </div>

    <a href="rating.html" class="button1" style="text-align: center; text-decoration: none; margin-top: 4px; background-color: #c0392b; color: white; padding: 12px; border-radius: 10px; font-weight: 600;">
      End Trip
    </a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      const map = L.map('map', { zoomControl: false }).setView([11.5833, 122.4833], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      setTimeout(() => {
        map.invalidateSize();
      }, 200);

      const urlParams = new URLSearchParams(window.location.search);
      const rideId = urlParams.get('ride_id');

      if (!rideId) {
        alert("No active ride specified.");
        window.location.href = "home.html";
        return;
      }

      const chatBtn = document.getElementById('chat-btn');
      if (chatBtn && rideId) {
        const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
        chatBtn.href = `messages.html?ride_id=${rideId}&return=${currentUrl}`;
      }

      const { data: rideData, error: rideError } = await _supabase
        .from('rides')
        .select('*')
        .eq('id', rideId)
        .single();

      if (rideError || !rideData) {
        console.log("No active ride found:", rideError);
        return;
      }

      // Map centers on pickup coordinates if available, but without placing the unwanted marker pin
      if (rideData.pickup_lat && rideData.pickup_lng) {
        map.setView([rideData.pickup_lat, rideData.pickup_lng], 15);
      }

      if (rideData.fare) {
        document.querySelector('.fare-amount').textContent = `₱ ${rideData.fare}.00`;
      }

      if (rideData.driver_id) {
        const { data: profileData, error: profileError } = await _supabase
          .from('profiles')
          .select('*')
          .eq('id', rideData.driver_id)
          .maybeSingle();

        const driverName = profileData?.fullname || profileData?.full_name || profileData?.name || profileData?.username || rideData.driver_name || 'Assigned Driver';
        document.querySelector('.driver-name').textContent = driverName;

        // Populate phone number and hook up Call button
        const callBtn = document.getElementById('call-btn');
        if (profileData?.phone) {
          callBtn.href = `tel:${profileData.phone}`;
          document.getElementById('driver-phone-label').textContent = profileData.phone;
        } else {
          callBtn.addEventListener('click', (e) => {
            e.preventDefault();
            alert("Driver phone number is not available.");
          });
        }

        const driverAvatar = profileData?.avatar_url || profileData?.avatar || profileData?.photo_url || profileData?.profile_pic || rideData.driver_avatar_url || null;
        
        const avatarEl = document.querySelector('.driver-avatar');
        if (avatarEl && driverAvatar) {
          avatarEl.innerHTML = `<img src="${driverAvatar}" alt="Driver" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
        } else if (avatarEl) {
          avatarEl.textContent = driverName.charAt(0).toUpperCase();
        }

        const driverProfileBox = document.querySelector('.driver-profile');
        if (driverProfileBox) {
          driverProfileBox.addEventListener('click', () => {
            const currentUrl = encodeURIComponent(window.location.pathname + window.location.search);
            window.location.href = `profile.html?id=${rideData.driver_id}&return=${currentUrl}`;
          });
        }
      }

      // Handle End Trip button for passenger
      const endTripBtn = document.querySelector('a[href="rating.html"]');
      if (endTripBtn) {
        endTripBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          await _supabase.from('rides').update({ status: 'completed' }).eq('id', rideId);
          window.location.href = `rating.html?ride_id=${rideId}`;
        });
      }
    });
  </script>
</body>
</html>
