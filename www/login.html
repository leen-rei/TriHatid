<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>
  <form class="register-box" id="login-form">
    <h1 class="title">TriHatid</h1>
    
    <label class="label" for="login-username">Email</label>
    <input type="email" id="login-username" class="input1" required>
    
    <label class="label" for="login-password">Password</label>
    <input type="password" id="login-password" class="input1" required>
    
    <!-- Changed from <a> to a proper submit <button> -->
    <button type="submit" class="button1">Login</button>

    <p class="switch-link">
      Don't have an account? <a href="register.html">Sign Up</a>
    </p>
  </form>

<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
    
    if (error) {
      alert("Login failed: " + error.message);
      return;
    }

    if (data.user) {
      // Grab role and fullname directly from user metadata (bypasses table RLS completely)
      const metadata = data.user.user_metadata || {};
      const role = metadata.role ? metadata.role.toLowerCase().trim() : 'passenger';
      const fullName = metadata.fullname || 'User';

      localStorage.setItem('user_role', role);
      localStorage.setItem('user_name', fullName);

      if (role === 'driver') {
        window.location.href = 'driver-dashboard.html';
      } else {
        window.location.href = 'home.html';
      }
    }
  });
</script>
</body>
</html>
