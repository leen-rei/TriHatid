<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - Welcome</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-frame">
    <!-- Hardware Notch -->
    <div class="notch"></div>
    
    <!-- Top Status Bar -->
    <!-- Top Status Bar -->
    <div class="status-bar">
      <div>19:02</div>
      <div class="status-icons">
        <div class="signal-bars">
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
        </div>
        <span class="lte-text">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

    <!-- Welcome Screen Content -->
    <div class="welcome-container">
      <!-- Background Image Area (Change 'your-background-image.jpg' to your image file) -->
      <div class="welcome-hero" style="background-image: url('welcome.jpg');">
        <div class="hero-overlay">
          <h1 class="welcome-logo">TriHatid</h1>
        </div>
      </div>

      <!-- Curved Bottom Sheet -->
      <div class="welcome-card">
        <h2 class="welcome-title">WELCOME</h2>
        <p class="welcome-subtitle">
          Your reliable ride across Aklan.<br>Where convenience meets your destination.
        </p>

        <div class="welcome-actions">
          <a href="login.html" class="welcome-btn btn-trihatid">Login</a>
          <a href="register.html" class="welcome-btn btn-outline">Sign Up</a>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
