<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - On Trip</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
  <style>
    .trip-card {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      background-color: #ffffff;
      padding: 18px 16px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status-badge {
      background-color: #214329;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      align-self: center;
    }
    .fare-box {
      text-align: center;
      margin: 8px 0;
    }
    .fare-amount {
      font-size: 28px;
      font-weight: 800;
      color: #214329;
    }
    .driver-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
    .driver-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background-color: #ccc;
    }
    .driver-info {
      flex: 1;
      text-align: left;
    }
    .driver-name {
      font-size: 14px;
      font-weight: 700;
      color: #1d1d1f;
    }
    .driver-vehicle {
      font-size: 11px;
      color: #666;
    }
    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-secondary-action {
      flex: 1;
      padding: 10px;
      background-color: #f0f0f0;
      color: #333;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="notch"></div>
    <div class="status-bar">
      <div>19:02</div>
      <div class="status-icons">
        <div class="signal-bars"><div class="signal-bar"></div><div class="signal-bar"></div><div class="signal-bar"></div><div class="signal-bar"></div></div>
        <span class="lte-text">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

    <div id="map" style="width: 100%; height: 100%;"></div>

    <div class="trip-card">
      <div class="status-badge">Enjoy your ride!</div>
      
      <div class="fare-box">
        <p style="font-size: 11px; color: #666;">Amount to pay</p>
        <span class="fare-amount">₱ 40.00</span>
      </div>

      <div class="driver-profile">
        <div class="driver-avatar"></div>
        <div class="driver-info">
          <span class="driver-name">Juan Dela Cruz</span>
        </div>
      </div>

      <div class="action-row">
        <a href="#" class="btn-secondary-action">Call</a>
        <a href="#" class="btn-secondary-action">Chat</a>
      </div>

      <a href="rating.html" class="button1" style="text-align: center; text-decoration: none; margin-top: 4px; background-color: #c0392b;">
        End Trip
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([11.5833, 122.4833], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  </script>
</body>
</html>
