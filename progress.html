<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid</title>
  
  <!-- Shared App Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-frame">
    <!-- Top Hardware Notch -->
    <div class="notch"></div>
    
    <!-- Top Status Bar -->
    <div class="status-bar">
      <div>19:02</div>
      <div class="status-icons">
        <div class="signal-bars">
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
        </div>
        <span class="lte-text">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

    <!-- Centered Loader Screen Content -->
    <div class="progress-container">

      <p style="font-size: 40px; color: #214329; font-weight: 800; margin-top: 12px; letter-spacing: 0.5px;">
        TriHatid
      </p>

      <div class="loader">
        <div></div><div></div><div></div><div></div>
      </div>
    </div>
  </div>

  <script>
    // Initial App Splash Screen: Show loader then redirect to welcome.html
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        window.location.href = "welcome.html";
      }, 2000); // 2 seconds loading window
    });
  </script>
</body>
</html>
