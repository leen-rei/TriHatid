<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid</title>
  
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="phone-frame">
    <!-- Notch -->
    <div class="notch"></div>
    
    <!-- Top Status Bar -->
    <div class="status-bar">
      <div>19:02</div>
      <div class="status-icons">
        <div class="signal-bars">
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
        </div>
        <span class="lte-text">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

<form class="register-box">
  <h1 class="title">TriHatid</h1>
  
  <label class="label" for="fullname">Name</label>
  <input type="text" id="fullname" placeholder="Juan Dela Cruz" class="input1">
  
  <label class="label" for="username">Username</label>
  <input type="text" id="username" placeholder="juandriver" class="input1">
  
  <label class="label" for="email">Email</label>
  <input type="email" id="email" placeholder="example@email.com" class="input1">
  
  <label class="label" for="password">Password</label>
  <input type="password" id="password" class="input1">
  
  <a href="home.html" class="button1">Submit</a>

      <p class="switch-link">
        Already have an account? <a href="login.html">Log In</a>
      </p>
</form>
  </div>
</body>
</html>
