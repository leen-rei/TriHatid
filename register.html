<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriHatid</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f0f0f0; }
    .phone-frame {
      width: 390px; height: 844px; background: #ffffff; border-radius: 55px;
      box-shadow: 0 0 0 12px #1d1d1f, 0 0 0 14px #2d2d2f, 0 30px 70px -15px rgba(0,0,0,0.5);
      overflow: hidden; position: relative;
    }
    .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 160px; height: 30px; background: #000; border-radius: 0 0 20px 20px; z-index: 10; }
    .battery-icon { width: 28px; height: 14px; border: 2.5px solid #000; border-radius: 4px; position: relative; display: inline-block; }
    .battery-icon::before { content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px; background: #000; border-radius: 2px; }
    .battery-icon::after { content: ''; position: absolute; right: -4px; top: 50%; transform: translateY(-50%); width: 2.5px; height: 8px; background: #000; border-radius: 0 2px 2px 0; }
    .signal-bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
    .signal-bar { width: 3.5px; background: #000; border-radius: 1px; }
    .signal-bar:nth-child(1) { height: 4px; }
    .signal-bar:nth-child(2) { height: 7px; }
    .signal-bar:nth-child(3) { height: 10px; }
    .signal-bar:nth-child(4) { height: 13px; }
    .form-container::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-8">
  <div class="phone-frame">
    <div class="notch"></div>
    <div class="bg-white text-black pt-3 px-8 flex justify-between items-center text-[16px] font-semibold">
      <div>19:02</div>
      <div class="flex items-center gap-1">
        <div class="signal-bars">
          <div class="signal-bar"></div><div class="signal-bar"></div>
          <div class="signal-bar"></div><div class="signal-bar"></div>
        </div>
        <span class="text-[14px] font-bold">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

<div class="register-box">
<h1 class="font-bold text-center text-[60px]" style="color: hsla(200, 100%, 30%, 0.8);">TriHatid</h1>
<input type="email" placeholder="example@email.com"></input>
</div>

</body>
</html>
