<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - Driver Mode</title>
  
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }
    .phone-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      box-sizing: border-box;
      position: relative;
    }
    .status-bar {
      position: relative;
      z-index: 9999;
      background-color: #ffffff;
      color: #000000;
      width: 100%;
      box-sizing: border-box;
    }
    .driver-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      box-sizing: border-box;
      overflow: hidden;
    }
    .view-content {
      display: none;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      box-sizing: border-box;
    }
    .view-content.active {
      display: block;
    }
    .map-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .driver-overlay-card {
      position: absolute;
      bottom: 85px;
      left: 16px;
      right: 16px;
      margin: 0 auto;
      width: calc(100% - 32px);
      background-color: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 18px 16px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }
    #driver-status-btn {
      background: #ccc;
      color: #333;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    #driver-status-btn.online {
      background: #2e7d32;
      color: #fff;
    }
    .panel-view {
      padding: 20px;
      background: #f7f9fa;
      overflow-y: auto;
      height: 100%;
      box-sizing: border-box;
    }
    .panel-title {
      font-size: 22px;
      font-weight: 800;
      color: #1d1d1f;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .profile-avatar {
      width: 55px;
      height: 55px;
      background: #214329;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
    }
    .profile-menu-item {
      background: #ffffff;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
    }
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #ffffff;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 15px;
      box-sizing: border-box;
      z-index: 9999;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #888;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-item.active {
      color: #214329;
    }
    .nav-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-home::before {
      content: '';
      border: 2px solid currentColor;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      width: 12px;
      height: 12px;
      display: block;
      margin-top: -3px;
    }
    .icon-home::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      background: currentColor;
      border-radius: 50%;
      top: 7px;
    }
    .icon-history::before {
      content: '';
      border: 2px solid currentColor;
      border-radius: 2px;
      width: 14px;
      height: 18px;
      display: block;
    }
    .icon-history::after {
      content: '';
      position: absolute;
      background: currentColor;
      left: 7px;
      top: 6px;
      width: 10px;
      height: 2px;
      box-shadow: 0 4px 0 currentColor;
    }
    .icon-profile::before {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border: 2px solid currentColor;
      border-radius: 50%;
      top: 1px;
    }
    .icon-profile::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 6px;
      border: 2px solid currentColor;
      border-bottom: none;
      border-radius: 5px 5px 0 0;
      bottom: 2px;
    }
  </style>
</head>

<body>
  <div class="phone-frame">
    <div class="notch"></div>
    
    <div class="status-bar">
      <div>19:02</div>
      <div class="status-icons">
        <div class="signal-bars">
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
          <div class="signal-bar"></div>
        </div>
        <span class="lte-text">LTE</span>
        <div class="battery-icon"></div>
      </div>
    </div>

    <div class="driver-wrapper">
      
      <!-- MAP & STATUS OVERLAY -->
      <div id="view-home" class="view-content active">
        <div class="map-container">
          <div id="map"></div>
        </div>

        <div class="driver-overlay-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0; font-size: 18px; color: #214329;">Driver Mode</h2>
            <button id="driver-status-btn">OFFLINE</button>
          </div>
          <p id="driver-status-text" style="margin: 0; font-size: 12px; color: #555;">You are offline. Go online to receive ride requests.</p>
        </div>
      </div>

      <!-- ACTIVITY HISTORY -->
      <div id="view-history" class="view-content">
        <div class="panel-view">
          <h2 class="panel-title">Activity History</h2>
          <div style="background: #fff; padding: 14px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
            <div style="font-weight: 700;">No trips completed yet</div>
            <div style="font-size: 12px; color: #666; margin-top: 4px;">Today</div>
          </div>
        </div>
      </div>

      <!-- DRIVER PROFILE -->
      <div id="view-profile" class="view-content">
        <div class="panel-view">
          <h2 class="panel-title">Account</h2>
          
          <div class="profile-header">
            <div class="profile-avatar">J</div>
            <div>
              <h3 style="margin: 0; font-size: 16px; color: #1d1d1f;">Juan Dela Cruz</h3>
              <p style="margin: 2px 0 0 0; font-size: 12px; color: #666; font-weight: 700;">Tricycle Driver</p>
            </div>
          </div>

          <div class="profile-menu-item" onclick="alert('Profile configuration settings panel opening...');">
            <span>Edit Profile</span>
            <span style="color: #ccc;">❯</span>
          </div>

<div class="profile-menu-item" onclick="localStorage.clear(); window.location.href='welcome.html';" style="color: #c62828;">
  <span>Log Out</span>
  <span>❯</span>
</div>
        </div>
      </div>

      <!-- BOTTOM NAVIGATION BAR -->
      <nav class="bottom-nav">
        <button class="nav-item active" id="nav-home" onclick="switchView('home')">
          <div class="nav-icon icon-home"></div>
          <span>Home</span>
        </button>
        <button class="nav-item" id="nav-history" onclick="switchView('history')">
          <div class="nav-icon icon-history"></div>
          <span>History</span>
        </button>
        <button class="nav-item" id="nav-profile" onclick="switchView('profile')">
          <div class="nav-icon icon-profile"></div>
          <span>Account</span>
        </button>
      </nav>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map;
    document.addEventListener('DOMContentLoaded', () => {
      map = L.map('map', { zoomControl: false }).setView([11.5833, 122.4833], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const statusBtn = document.getElementById('driver-status-btn');
      const statusText = document.getElementById('driver-status-text');
      let isOnline = false;

      if (statusBtn) {
        statusBtn.addEventListener('click', () => {
          isOnline = !isOnline;
          if (isOnline) {
            statusBtn.textContent = 'ONLINE';
            statusBtn.classList.add('online');
            statusText.textContent = 'Active. Awaiting passenger requests...';
          } else {
            statusBtn.textContent = 'OFFLINE';
            statusBtn.classList.remove('online');
            statusText.textContent = 'You are offline. Go online to receive ride requests.';
          }
        });
      }
    });

    function switchView(viewName) {
      document.querySelectorAll('.view-content').forEach(el => {
        el.classList.remove('active');
      });
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.remove('active');
      });

      const targetView = document.getElementById(`view-${viewName}`);
      const targetNav = document.getElementById(`nav-${viewName}`);

      if (targetView) targetView.classList.add('active');
      if (targetNav) targetNav.classList.add('active');

      if (viewName === 'home' && map) {
        setTimeout(() => map.invalidateSize(), 150);
      }
    }
  </script>
</body>
</html>
